name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t slideforge-mcp .
      # Glama scores the image by listing tools with no key and no network.
      # Prove that still works: initialize, then tools/list, expect all 7.
      - name: Keyless tools/list over stdio
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | docker run -i --rm slideforge-mcp > out.jsonl
          cat out.jsonl
          python - <<'PY'
          import json, sys
          tools = None
          for line in open("out.jsonl"):
              line = line.strip()
              if not line.startswith("{"):
                  continue
              msg = json.loads(line)
              if msg.get("id") == 2:
                  tools = msg["result"]["tools"]
          if tools is None:
              sys.exit("no tools/list response")
          served = sorted(t["name"] for t in tools)
          contract = json.load(open("src/slideforge_mcp/contract/tools_list.prod.json"))
          expected = sorted(t["name"] for t in contract["tools"])
          print(served)
          if served != expected:
              sys.exit(f"tool set drifted: {served} != {expected}")
          PY
